name: CI

on:
  push:
    branches: [main, "migracija/**"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - name: Install pnpm (Node 26 has no corepack)
        run: npm install --global pnpm@12.21.0 && test "$(pnpm --version)" = "12.21.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Install Chromium for e2e
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  # Shared scans from ductura/.github, pinned to a full SHA (DAN-1555).
  secret-scan:
    uses: ductura/.github/.github/workflows/secret-scan.yml@97c31e9178438ef0d7e663a609cea1b459a3e3aa # v0 main nakon .github#89

  # Only a pull request has something to compare, so the job is skipped on push;
  # ci-ok allows exactly that skip (allow-skipped below).
  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ductura/.github/.github/workflows/dependency-review.yml@97c31e9178438ef0d7e663a609cea1b459a3e3aa # v0 main nakon .github#89

  # The one required status: a plain job, so the check is named exactly ci-ok.
  # Body is the block of ductura/.github ci-ok.yml (between ci-ok:begin and ci-ok:end).
  # Green only when every job above succeeded; failure, cancelled or a missing result fails it.
  ci-ok:
    if: ${{ always() }}
    needs: [ci, secret-scan, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every needed job succeeded
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
          ALLOW_SKIPPED: dependency-review
        run: |
          # ci-ok:begin
          set -euo pipefail
          if ! jq -e 'type == "object" and length > 0' >/dev/null 2>&1 <<< "$RESULTS"; then
            echo "::error::results must be a non-empty JSON object; pass toJSON(needs) from a job with needs"
            exit 1
          fi
          allowed="$(tr -s ' \t\r\n' '\n' <<< "$ALLOW_SKIPPED" | sed '/^$/d' | jq -R . | jq -sc .)"
          problems="$(jq -r --argjson allowed "$allowed" '
            (($allowed - keys) | map("allow-skipped names a job that is not in needs: \(.)"))
            + (to_entries | map(
                ((.value | objects | .result) // "missing") as $r
                | if $r == "success" then empty
                  elif $r == "skipped" and (.key as $k | $allowed | index($k)) then empty
                  else "job \(.key) result: \($r)" end))
            | .[]' <<< "$RESULTS")"
          if [ -n "$problems" ]; then
            while IFS= read -r line; do echo "::error::$line"; done <<< "$problems"
            exit 1
          fi
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          echo "ci-ok: $(jq length <<< "$RESULTS") job(s) passed"
          # ci-ok:end
